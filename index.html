<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thornhaven Capital</title>
<meta name="description" content="Thornhaven Capital.">
<link rel="canonical" href="https://thornmgmt.com/">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Thornhaven Capital">
<meta property="og:title" content="Thornhaven Capital">
<meta property="og:description" content="Thornhaven Capital.">
<meta property="og:url" content="https://thornmgmt.com/">
<meta property="og:image" content="https://thornmgmt.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/css/site.css">
</head>
<body>

<main>

  <h1 class="mark">
    <span class="mark__name">Thornhaven</span>
    <span class="mark__kind">Capital</span>
  </h1>

  <hr class="rule">

  <ul class="contact">
    <li><a href="mailto:manager@thornmgmt.com">manager@thornmgmt.com</a></li>
    <li><a href="tel:+14045488131">+1 404 548 8131</a></li>
  </ul>

  <details class="disclosure">
    <summary>Send a message<span class="chev" aria-hidden="true">&#9654;</span></summary>

    <!-- Formspree, delivering to manager@thornmgmt.com. -->
    <form class="form" id="contact-form" method="post"
          action="https://formspree.io/f/xgogpqdg">

      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" name="name" autocomplete="name">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="3"></textarea>
      </div>

      <div class="hp" aria-hidden="true">
        <label for="_gotcha">Leave this field empty</label>
        <input id="_gotcha" type="text" name="_gotcha" tabindex="-1" autocomplete="off">
      </div>

      <input type="hidden" name="_subject" value="thornmgmt.com — new message">

      <button class="btn" type="submit">Send</button>
      <p class="status" id="form-status" role="status" aria-live="polite"></p>

    </form>
  </details>

</main>

<footer class="foot">
  <p>&copy; 2026 Thornhaven Capital</p>
  <!-- Remove this one line to drop the no-offer notice. -->
  <p class="legal">This site is for informational purposes only and does not constitute an offer to sell or a solicitation of an offer to buy any security.</p>
</footer>

<script>
(function () {
  var form   = document.getElementById('contact-form');
  var status = document.getElementById('form-status');
  if (!form || !status) return;

  var MAILTO = '<a href="mailto:manager@thornmgmt.com">manager@thornmgmt.com</a>';

  form.addEventListener('submit', function (e) {
    // Endpoint not yet wired: never post into the void.
    if (form.action.indexOf('REPLACE_WITH') !== -1) {
      e.preventDefault();
      status.innerHTML = 'The form is not connected yet. Email ' + MAILTO + '.';
      return;
    }

    e.preventDefault();
    var btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    status.textContent = 'Sending…';

    fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: { Accept: 'application/json' }
    }).then(function (res) {
      if (!res.ok) throw new Error(res.status);
      form.innerHTML = '<p class="status">Thank you. Your message is on its way.</p>';
    }).catch(function () {
      btn.disabled = false;
      status.innerHTML = 'That didn’t send. Email ' + MAILTO + ' instead.';
    });
  });
})();
</script>

</body>
</html>
